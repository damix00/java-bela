name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Path filtering lives in a job rather than in `on.*.paths` so that every job
  # still reports a status. Workflow-level path filters make required checks
  # hang forever on PRs that don't touch the filtered paths.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/src/**'
              - 'apps/api/build.gradle'
              - 'apps/api/settings.gradle'
              - 'apps/api/gradle/**'
              - 'apps/api/gradlew'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - '.github/workflows/ci.yml'

  api:
    name: API (Gradle)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Tests exercise internal-request authentication, but CI should not need
      # a production secret to boot the Spring context.
      INTERNAL_API_KEY: ci-internal-api-key
    # BelaBackendApplicationTests.contextLoads() boots the full Spring context,
    # which needs both Postgres and Redis. Without these the job fails before
    # running a single assertion.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bela
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/test

  web:
    name: Web (Next.js)
    needs: changes
    # API DTO changes can affect the generated package consumed by the web app.
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Always build against the protocol generated from this checkout. API
      # changes no longer require a developer to run a package-manager command.
      - name: Generate protocol types
        working-directory: apps/api
        run: ./gradlew generateTypeScript

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build:web

      # The README claims CI fails on stale generated types, but nothing checked until now:
      # generateTypeScript regenerated the file and the diff was silently discarded. A stale
      # committed generated.ts would pass, and the web app would build against types that no
      # longer match the API.
      - name: Check generated protocol types are current
        run: git diff --exit-code packages/protocol/src/generated.ts

  deploy:
    name: Deploy
    needs: [api, web]
    # `always()` is load-bearing. The api and web jobs are path-filtered, so a web-only change
    # skips the api job — and a skipped dependency would skip this one too under the default
    # rule. Deploying still has to happen, so the condition asks only that nothing FAILED.
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.api.result != 'failure' && needs.api.result != 'cancelled'
      && needs.web.result != 'failure' && needs.web.result != 'cancelled'
    runs-on: ubuntu-latest
    # One deploy at a time. Two pushes in quick succession would otherwise race each other onto
    # the same box, and cancel-in-progress would abort a half-finished swap — so queue instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Lets the automatic GITHUB_TOKEN push to GHCR, so the registry needs no PAT of its own.
    permissions:
      contents: read
      packages: write
    env:
      # Minted per run and scoped to this repository, so there is no long-lived registry
      # credential to store or rotate.
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      # The Cloudflare origin certificate kamal-proxy serves. Missing here, Kamal resolves them
      # to empty strings and writes empty PEM files, and the proxy fails with "unable to load
      # certificate" only after the app has already booted healthily.
      CERTIFICATE_PEM: ${{ secrets.CERTIFICATE_PEM }}
      PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v '~> 2.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Unhashed on purpose. `ssh-keyscan -H` hashes the hostname, and Kamal's Ruby SSH client
      # does not resolve hashed entries the way OpenSSH does — it fails to find the host and
      # reports a fingerprint mismatch instead of a missing key, which is a confusing way to
      # learn this. ed25519 only, so one key type is offered and compared.
      - name: Trust the host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 62.238.122.182 >> ~/.ssh/known_hosts

      # API first: a schema migration has to be live before the client that depends on it.
      - name: Deploy API
        run: kamal deploy -c config/deploy.api.yml

      - name: Deploy web
        run: kamal deploy -c config/deploy.web.yml

      # The health check alone cannot catch every broken deploy — a container with no CORS
      # mapping is "healthy" and still unusable from a browser — so assert on the header that
      # actually distinguishes them, not just on a 200.
      - name: Smoke check
        run: |
          set -e
          echo "API readiness:"
          curl -fsS https://bela-api.damjan.pro/actuator/health/readiness

          echo "Web:"
          curl -fsS -o /dev/null -w '%{http_code}\n' https://bela.damjan.pro/api/health

          echo "CORS mapping present:"
          curl -fsS -o /dev/null -D - -X OPTIONS https://bela-api.damjan.pro/auth/me \
            -H 'Origin: https://bela.damjan.pro' \
            -H 'Access-Control-Request-Method: GET' \
            | grep -qi 'access-control-allow-origin: https://bela.damjan.pro' \
            || { echo "No CORS header — is SPRING_PROFILES_ACTIVE=prod set?"; exit 1; }

          # Every check above passed while the lobby was completely unreachable, because none of
          # them used the host and path the browser actually uses. This one does. It covers the
          # whole chain in one request: DNS, a TLS certificate that genuinely matches the name,
          # Cloudflare and kamal-proxy both forwarding the Upgrade, and the handler mounted at
          # /ws. The lobby has no REST surface, so a socket that does not open is a dead app.
          #
          # No token on purpose: WebSocketAuthInterceptor accepts an unauthenticated handshake
          # and closes with 4401 afterwards, so 101 is the correct answer here and CI never has
          # to mint a JWT.
          #
          # --max-time with `|| true` because curl treats 101 as informational and waits for a
          # final response that never arrives; -D has written the status line long before then.
          echo "WebSocket upgrade:"
          ws=$(curl -sS --http1.1 --max-time 10 -o /dev/null -D - \
            -H 'Connection: Upgrade' \
            -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' \
            -H 'Sec-WebSocket-Key: AAAAAAAAAAAAAAAAAAAAAA==' \
            -H 'Origin: https://bela.damjan.pro' \
            https://bela-api.damjan.pro/ws 2>/dev/null || true)
          echo "$ws" | head -1
          echo "$ws" | grep -qi '^HTTP/1.1 101' \
            || { echo "No 101 — check NEXT_PUBLIC_WS_URL host and /ws path, and that TLS covers the name"; exit 1; }

          # And that the allow-list still bites. A WebSocket upgrade never passes through the
          # CORS filter, so setAllowedOrigins in WebSocketConfig is the only thing standing
          # between the lobby and any origin on the internet — and this is the only place that
          # protection is observable from outside.
          echo "WebSocket origin allow-list:"
          ws_foreign=$(curl -sS --http1.1 --max-time 10 -o /dev/null -D - \
            -H 'Connection: Upgrade' \
            -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' \
            -H 'Sec-WebSocket-Key: AAAAAAAAAAAAAAAAAAAAAA==' \
            -H 'Origin: https://evil.example' \
            https://bela-api.damjan.pro/ws || true)
          echo "$ws_foreign" | head -1
          if echo "$ws_foreign" | grep -qi '^HTTP/1.1 101'; then
            echo "A foreign origin was upgraded — is FRONTEND_DOMAIN set?"
            exit 1
          fi
