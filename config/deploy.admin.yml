# Kamal configuration for the read-only Next.js admin panel.

service: bela-admin
image: damix00/bela-admin

servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST") %>

proxy:
  ssl:
    certificate_pem: CERTIFICATE_PEM
    private_key_pem: PRIVATE_KEY_PEM
  # Keep this at one subdomain level so Cloudflare's edge certificate covers it.
  # The origin certificate in CERTIFICATE_PEM must also include this hostname or
  # *.damjan.pro before the first deploy.
  host: bela-admin.damjan.pro
  app_port: 3000
  healthcheck:
    path: /api/health
    interval: 3
    timeout: 3

registry:
  server: ghcr.io
  username: damix00
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: .
  dockerfile: apps/admin/Dockerfile

ssh:
  user: damjan

deploy_timeout: 60
drain_timeout: 30

env:
  clear:
    INTERNAL_API_URL: http://bela-api:8080
    SECURE_COOKIES: "true"
  secret:
    - INTERNAL_API_KEY_SB
