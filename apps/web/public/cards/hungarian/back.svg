        <g fill="#f3f1e7" stroke="#16210f" stroke-width="4">
            <rect x="45" y="45" width="18" height="18" transform="rotate(45 54 54)" />
            <rect x="300" y="45" width="18" height="18" transform="rotate(45 309 54)" />
            <rect x="45" y="522" width="18" height="18" transform="rotate(45 54 531)" />
            <rect x="300" y="522" width="18" height="18" transform="rotate(45 309 531)" />
        </g>
    </g>

    <rect x="3" y="3" width="357" height="579" rx="27" fill="none" stroke="#16210f" stroke-width="6" />
