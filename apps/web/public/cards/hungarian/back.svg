<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 363 585" role="img" aria-labelledby="title description">
    <title id="title">Belote card back</title>
    <description id="description">A symmetrical geometric card back in cream, rust, forest green, and dark ink.</description>

    <defs>
        <pattern id="lattice" x="13.5" y="-19.5" width="48" height="48" patternUnits="userSpaceOnUse">
            <rect width="48" height="48" fill="#1d4a2d" />
            <path d="M-24 24 24-24M0 48 48 0M24 72 72 24" fill="none" stroke="#e2e5cf" stroke-width="3" opacity=".28" />
            <path d="M-24 24 24 72M0 0 48 48M24-24 72 24" fill="none" stroke="#16210f" stroke-width="3" opacity=".42" />
            <rect x="18" y="18" width="12" height="12" fill="#d1603d" stroke="#16210f" stroke-width="3" transform="rotate(45 24 24)" />
            <rect x="22" y="22" width="4" height="4" fill="#f3f1e7" transform="rotate(45 24 24)" />
        </pattern>

        <clipPath id="card-shape">
            <rect x="3" y="3" width="357" height="579" rx="27" />
