spring.config.import=optional:file:.env[.properties]

spring.application.name=bela-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bela}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Flyway owns the schema in every profile, so the migrations are exercised by the test
# suite rather than first run in production. validate turns entity drift into a boot
# failure the moment it is introduced.
spring.jpa.hibernate.ddl-auto=validate

# Databases that predate Flyway were built by ddl-auto=update and already hold the
# tables V1 creates, which Flyway would otherwise refuse to touch. Baselining stamps
# them as already at V1 and applies only what comes after. A fresh database is empty,
# so it runs V1 normally.
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true

# Add the driver explicitly to help Spring find it
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicitly set the dialect to stop the guessing error
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# app options

# Development convenience only. This literal is committed and therefore public;
# application-prod.properties redeclares the property with no default so a production
# instance missing JWT_SECRET fails to boot rather than signing tokens with it.
app.jwt.secret=${JWT_SECRET:default_secret_1234567890_qwertyuiopasdfghjklzxcvbnm}
# 15 minutes: access tokens are short-lived, refresh tokens carry the session
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# 30 days
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
# 24 hours, matching the guest account sweep in UserCleanupService
app.jwt.refresh-anonymous-expiration-ms=${JWT_REFRESH_ANON_EXPIRATION_MS:86400000}
# 30 seconds of grace for a just-rotated refresh token, so two tabs racing don't log each other out
app.jwt.refresh-grace-ms=${JWT_REFRESH_GRACE_MS:30000}

app.internal-api-key=${INTERNAL_API_KEY}
app.frontend-domain=${FRONTEND_DOMAIN:http://localhost:3000}
app.backend-domain=${BACKEND_DOMAIN:http://localhost:8080}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# actuator: expose health for readiness/liveness probes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never