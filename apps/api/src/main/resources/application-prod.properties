# Production overrides. application.properties carries development defaults; everything
# here either hardens one of them or fails the boot rather than let it through.
#
# SPRING_PROFILES_ACTIVE=prod is mandatory, and not only for these values: ProdCorsConfig
# and DevCorsConfig are both @Profile-gated, so with no profile active neither bean
# registers and the API serves no CORS mapping at all.

spring.jpa.show-sql=false

# No default. An instance that reaches production without JWT_SECRET set must not fall
# back to the literal in application.properties, which is committed and therefore public.
app.jwt.secret=${JWT_SECRET}

# Graceful shutdown is already the Spring Boot 4 default; it is spelled out because the
# deploy depends on it and a silent default is easy to regress. In-flight requests finish
# before the old instance stops, and the deploy's drain timeout has to exceed the shutdown
# phase or the container is killed mid-drain anyway.
#
# Long-lived WebSockets do not drain — they are cut when the timeout expires. That is
# accepted: game state lives in Redis, UserSession has a 30s TTL, and the client
# reconnects with backoff well inside it, so players return to their seats.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Two app instances overlap during a deploy, so the real ceiling is twice this.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

logging.level.root=INFO
logging.level.pro.damjan.belabackend=INFO
logging.level.org.hibernate.SQL=WARN
