plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'cz.habarta.typescript-generator' version '3.2.1263'
}

group = 'pro.damjan'
version = '0.0.1-SNAPSHOT'
description = 'bela-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // rate limiting
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'com.bucket4j:bucket4j-redis:8.10.1'


    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

}

// Emits TypeScript for the WebSocket/REST wire protocol into packages/protocol.
// Reads the classes through Jackson's rules, so the generated property names
// match what actually goes over the wire (e.g. Card.isTrump -> "trump").
tasks.named('generateTypeScript') {
    jsonLibrary = 'jackson2'
    outputKind = 'module'
    outputFileType = 'implementationFile'
    outputFile = "${rootDir}/../../packages/protocol/src/generated.ts"
    mapEnum = 'asEnum'
    nonConstEnums = true
    mapClasses = 'asInterfaces'
    noFileComment = true
    sortDeclarations = true

    classPatterns = [
            'pro.damjan.belabackend.**.dto.**',
            'pro.damjan.belabackend.game.model.**',
            'pro.damjan.belabackend.lobby.model.**',
            'pro.damjan.belabackend.user.auth.refresh.RefreshError',
            'pro.damjan.belabackend.user.auth.Role',
            'pro.damjan.belabackend.user.presence.PresenceStatus',
            'pro.damjan.belabackend.security.jwt.TokenError',
    ]

    excludeClassPatterns = [
            'pro.damjan.belabackend.**.*Resolver',
            'pro.damjan.belabackend.**.*Validator',
            'pro.damjan.belabackend.**.*Ordering',
            // Lombok @Builder nested classes are build-time helpers, never on the
            // wire. Their binary names contain '$', so match with a bare '**'.
            'pro.damjan.belabackend.**Builder',
    ]

    // Marker interface; would otherwise emit an empty `interface Serializable {}`
    // that every model pointlessly extends.
    excludeClasses = ['java.io.Serializable']
}

// The single entry point for code generation. Right now TypeScript is the only
// generator; wire any future one in here rather than teaching callers (the IDE
// run configuration, CI) about each task by name.
tasks.register('generateTypes') {
    group = 'build'
    description = 'Runs every wire-protocol generator.'
    dependsOn 'generateTypeScript'
}
